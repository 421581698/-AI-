name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ourai
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: ourai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ourai -d ourai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://ourai:ci-password@localhost:5432/ourai
      AUTH_TOKEN_SECRET: ci-session-signing-secret-at-least-32-characters
      API_KEY: ci-bootstrap-api-key-at-least-16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Report dependency audit findings
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); console.log(JSON.stringify(a.vulnerabilities || {}, null, 2))'
      - name: Enforce dependency audit threshold
        run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run build
      - name: Apply PostgreSQL migrations
        run: npm run db:migrate
      - name: Run unit and PostgreSQL integration tests
        run: npm test
      - name: Build production Docker image
        run: docker build -t our-ai-hub:ci .
      - name: Verify PostgreSQL backup and restore with matching PG16 tools
        run: |
          docker run --rm --network host -v /tmp:/backup -e DATABASE_URL="$DATABASE_URL" --entrypoint sh pgvector/pgvector:pg16 -c 'pg_dump "$DATABASE_URL" --format=custom --no-owner --no-acl --file=/backup/our-ai-hub.dump'
          docker run --rm --network host -v /tmp:/backup -e PGPASSWORD=ci-password --entrypoint sh pgvector/pgvector:pg16 -c 'createdb -h localhost -U ourai ourai_restore && pg_restore --dbname=postgres://ourai:ci-password@localhost:5432/ourai_restore --exit-on-error /backup/our-ai-hub.dump && test "$(psql postgres://ourai:ci-password@localhost:5432/ourai_restore -Atc '\''SELECT count(*) FROM schema_migrations'\'')" -eq 4'
      - name: Smoke test production container
        run: |
          docker run -d --name our-ai-hub-smoke --network host -e NODE_ENV=production -e HOST=0.0.0.0 -e PORT=8787 -e DATABASE_URL="$DATABASE_URL" -e API_KEY="$API_KEY" -e AUTH_TOKEN_SECRET="$AUTH_TOKEN_SECRET" our-ai-hub:ci
          trap 'docker rm -f our-ai-hub-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health >/tmp/our-ai-hub-health.json; then break; fi
            sleep 1
          done
          cat /tmp/our-ai-hub-health.json
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8787/console)" = 200
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8787/v1/auth/me)" = 401
