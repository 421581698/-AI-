services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ourai
      POSTGRES_PASSWORD: ourai_dev_only
      POSTGRES_DB: ourai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ourai_pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ourai -d ourai"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  ourai_pgdata:
